<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeout 05</title>
</head>
<body>
<h1>Timeout</h1>
<script>
function poll() { fetch("https://10.255.255.1/poll?" + Date.now()).catch(function () {}).finally(function () { setTimeout(poll, 50); }); }
for (var i = 0; i < 6; i++) { poll(); }
</script>
</body>
</html>
