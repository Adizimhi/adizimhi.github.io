<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider Dragging Movements Failures</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
    }

    .list {
      display: grid;
      gap: 24px;
      padding: 0;
      list-style: none;
    }

    .list-item {
      padding: 20px;
      border: 1px solid #cccccc;
      border-radius: 8px;
    }

    .itemContent {
      display: grid;
      gap: 12px;
    }

    .slider {
      position: relative;
      width: 320px;
      height: 12px;
      background: #d6d6d6;
      border-radius: 6px;
      touch-action: none;
    }

    .slider-thumb {
      position: absolute;
      top: 50%;
      left: 40%;
      width: 24px;
      height: 24px;
      background: #333333;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
    }

    .vertical-slider {
      position: relative;
      width: 12px;
      height: 220px;
      background: #d6d6d6;
      border-radius: 6px;
      touch-action: none;
    }

    .vertical-slider .slider-thumb {
      top: 60%;
      left: 50%;
    }

    .range-slider {
      position: relative;
      width: 320px;
      height: 12px;
      background: #d6d6d6;
      border-radius: 6px;
      touch-action: none;
    }

    .range-slider .slider-thumb:first-child {
      left: 25%;
    }

    .range-slider .slider-thumb:last-child {
      left: 75%;
    }

    .meter-slider {
      position: relative;
      width: 320px;
      height: 20px;
      background: linear-gradient(to right, #dddddd 0 50%, #999999 50% 100%);
      border-radius: 10px;
      touch-action: none;
    }

    .image-slider {
      position: relative;
      width: 320px;
      height: 160px;
      overflow: hidden;
      border: 1px solid #777777;
      touch-action: none;
    }

    .image-slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-slider .slider-thumb {
      top: 50%;
      left: 50%;
      height: 160px;
      width: 8px;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Slider Dragging Movements Failures</h1>

    <ul class="list">
      <li class="list-item" id="slider-dragging-movements-failure-1">
        <div class="itemContent">
          <h2>Volume</h2>
          <div class="slider" data-drag-slider>
            <div
              class="slider-thumb"
              role="slider"
              aria-label="Volume"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="40"
              tabindex="0"
            ></div>
          </div>
        </div>
      </li>

      <li class="list-item" id="slider-dragging-movements-failure-2">
        <div class="itemContent">
          <h2>Screen brightness</h2>
          <div class="slider" data-drag-slider>
            <span
              class="slider-thumb"
              role="slider"
              aria-label="Screen brightness"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="40"
              tabindex="0"
            ></span>
          </div>
        </div>
      </li>

      <li class="list-item" id="slider-dragging-movements-failure-3">
        <div class="itemContent">
          <h2>Playback position</h2>
          <div class="slider" data-drag-slider>
            <div
              class="slider-thumb"
              role="slider"
              aria-label="Playback position"
              aria-valuemin="0"
              aria-valuemax="300"
              aria-valuenow="120"
              aria-valuetext="2 minutes"
              tabindex="0"
            ></div>
          </div>
        </div>
      </li>

      <li class="list-item" id="slider-dragging-movements-failure-4">
        <div class="itemContent">
          <h2>Temperature</h2>
          <div class="vertical-slider" data-vertical-drag-slider>
            <div
              class="slider-thumb"
              role="slider"
              aria-label="Temperature"
              aria-orientation="vertical"
              aria-valuemin="10"
              aria-valuemax="30"
              aria-valuenow="22"
              tabindex="0"
            ></div>
          </div>
        </div>
      </li>

      <li class="list-item" id="slider-dragging-movements-failure-5">
        <div class="itemContent">
          <h2>Price range</h2>
          <div class="range-slider" data-range-drag-slider>
            <div
              class="slider-thumb"
              role="slider"
              aria-label="Minimum price"
              aria-valuemin="0"
              aria-valuemax="1000"
              aria-valuenow="250"
              tabindex="0"
            ></div>
            <div
              class="slider-thumb"
              role="slider"
              aria-label="Maximum price"
              aria-valuemin="0"
              aria-valuemax="1000"
              aria-valuenow="750"
              tabindex="0"
            ></div>
          </div>
        </div>
      </li>

      <li class="list-item" id="slider-dragging-movements-failure-6">
        <div class="itemContent">
          <h2>Image zoom</h2>
          <div class="slider" data-drag-slider>
            <button
              class="slider-thumb"
              role="slider"
              aria-label="Image zoom"
              aria-valuemin="100"
              aria-valuemax="500"
              aria-valuenow="260"
              type="button"
            ></button>
          </div>
        </div>
      </li>

      <li class="list-item" id="slider-dragging-movements-failure-7">
        <div class="itemContent">
          <h2>Audio balance</h2>
          <div class="meter-slider" data-drag-slider>
            <div
              class="slider-thumb"
              role="slider"
              aria-label="Audio balance"
              aria-valuemin="-50"
              aria-valuemax="50"
              aria-valuenow="-10"
              aria-valuetext="10 percent left"
              tabindex="0"
            ></div>
          </div>
        </div>
      </li>

      <li class="list-item" id="slider-dragging-movements-failure-8">
        <div class="itemContent">
          <h2>Before and after image comparison</h2>
          <div class="image-slider" data-drag-slider>
            <img src="https://picsum.photos/640/320" alt="Landscape comparison">
            <div
              class="slider-thumb"
              role="slider"
              aria-label="Image comparison position"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="50"
              tabindex="0"
            ></div>
          </div>
        </div>
      </li>

      <li class="list-item" id="slider-dragging-movements-failure-9">
        <div class="itemContent">
          <h2>Text size</h2>
          <div
            class="slider"
            role="slider"
            aria-label="Text size"
            aria-valuemin="12"
            aria-valuemax="32"
            aria-valuenow="20"
            tabindex="0"
            data-track-drag-slider
          >
            <div class="slider-thumb"></div>
          </div>
        </div>
      </li>

      <li class="list-item" id="slider-dragging-movements-failure-10">
        <div class="itemContent">
          <h2>Animation speed</h2>
          <div class="slider" data-drag-slider>
            <span
              class="slider-thumb"
              role="slider"
              aria-label="Animation speed"
              aria-valuemin="1"
              aria-valuemax="10"
              aria-valuenow="4"
              aria-valuetext="Normal"
              tabindex="0"
            ></span>
          </div>
          <output>Speed: 4</output>
        </div>
      </li>
    </ul>
  </main>

  <script>
    const updateHorizontalSlider = (track, thumb, clientX) => {
      const rectangle = track.getBoundingClientRect();
      const percentage = Math.min(
        100,
        Math.max(0, ((clientX - rectangle.left) / rectangle.width) * 100)
      );

      thumb.style.left = `${percentage}%`;

      const minimum = Number(thumb.getAttribute("aria-valuemin"));
      const maximum = Number(thumb.getAttribute("aria-valuemax"));
      const value = Math.round(minimum + ((maximum - minimum) * percentage) / 100);

      thumb.setAttribute("aria-valuenow", String(value));

      const output = track.parentElement.querySelector("output");

      if (output) {
        output.textContent = `Speed: ${value}`;
      }
    };

    const updateVerticalSlider = (track, thumb, clientY) => {
      const rectangle = track.getBoundingClientRect();
      const percentage = Math.min(
        100,
        Math.max(0, ((clientY - rectangle.top) / rectangle.height) * 100)
      );

      thumb.style.top = `${percentage}%`;

      const minimum = Number(thumb.getAttribute("aria-valuemin"));
      const maximum = Number(thumb.getAttribute("aria-valuemax"));
      const value = Math.round(maximum - ((maximum - minimum) * percentage) / 100);

      thumb.setAttribute("aria-valuenow", String(value));
    };

    document.querySelectorAll("[data-drag-slider]").forEach((track) => {
      const thumb = track.querySelector('[role="slider"]');
      let dragging = false;

      thumb.addEventListener("pointerdown", (event) => {
        dragging = true;
        thumb.setPointerCapture(event.pointerId);
      });

      thumb.addEventListener("pointermove", (event) => {
        if (!dragging) {
          return;
        }

        updateHorizontalSlider(track, thumb, event.clientX);
      });

      thumb.addEventListener("pointerup", (event) => {
        dragging = false;
        thumb.releasePointerCapture(event.pointerId);
      });
    });

    document.querySelectorAll("[data-vertical-drag-slider]").forEach((track) => {
      const thumb = track.querySelector('[role="slider"]');
      let dragging = false;

      thumb.addEventListener("pointerdown", (event) => {
        dragging = true;
        thumb.setPointerCapture(event.pointerId);
      });

      thumb.addEventListener("pointermove", (event) => {
        if (!dragging) {
          return;
        }

        updateVerticalSlider(track, thumb, event.clientY);
      });

      thumb.addEventListener("pointerup", (event) => {
        dragging = false;
        thumb.releasePointerCapture(event.pointerId);
      });
    });

    document.querySelectorAll("[data-range-drag-slider]").forEach((track) => {
      track.querySelectorAll('[role="slider"]').forEach((thumb) => {
        let dragging = false;

        thumb.addEventListener("pointerdown", (event) => {
          dragging = true;
          thumb.setPointerCapture(event.pointerId);
        });

        thumb.addEventListener("pointermove", (event) => {
          if (!dragging) {
            return;
          }

          updateHorizontalSlider(track, thumb, event.clientX);
        });

        thumb.addEventListener("pointerup", (event) => {
          dragging = false;
          thumb.releasePointerCapture(event.pointerId);
        });
      });
    });

    document.querySelectorAll("[data-track-drag-slider]").forEach((track) => {
      const thumb = track.querySelector(".slider-thumb");
      let dragging = false;

      thumb.addEventListener("pointerdown", (event) => {
        dragging = true;
        thumb.setPointerCapture(event.pointerId);
      });

      thumb.addEventListener("pointermove", (event) => {
        if (!dragging) {
          return;
        }

        const rectangle = track.getBoundingClientRect();
        const percentage = Math.min(
          100,
          Math.max(0, ((event.clientX - rectangle.left) / rectangle.width) * 100)
        );

        thumb.style.left = `${percentage}%`;

        const minimum = Number(track.getAttribute("aria-valuemin"));
        const maximum = Number(track.getAttribute("aria-valuemax"));
        const value = Math.round(minimum + ((maximum - minimum) * percentage) / 100);

        track.setAttribute("aria-valuenow", String(value));
      });

      thumb.addEventListener("pointerup", (event) => {
        dragging = false;
        thumb.releasePointerCapture(event.pointerId);
      });
    });
  </script>
</body>
</html>
